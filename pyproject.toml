[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primer-webapp"
version = "0.4.0"
description = "Private, local primer design and independent sequencing verification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dynamic = ["dependencies"]

[project.scripts]
primer-webapp = "primer_webapp.launcher:main"

[tool.setuptools]
packages = ["primer_webapp", "primer_webapp.app"]
package-dir = {primer_webapp = "."}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
primer_webapp = ["config/*.json", "config/*.yaml", "resources/templates/*.xlsx", "resources/examples/*.tsv", "examples/*.gbk", "examples/*.fasta"]
